{% extends 'voting/base.html' %}

{% block title %}Voter Login - SecureVote{% endblock %}

{% block content %}
<div class="glass-panel form-container">
    <h2 class="form-title">Voter Sign In</h2>
    
    {% if form.non_field_errors %}
        <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 8px; margin-bottom: 20px; color: var(--color-danger); font-size: 14px; font-weight: 500;">
            {% for error in form.non_field_errors %}
                <p>⚠️ {{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
    
    <form method="post" novalidate>
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_username">Username</label>
            <input 
                type="text" 
                name="username" 
                id="id_username" 
                class="form-control" 
                placeholder="Enter your username"
                required
            >
        </div>
        
        <div class="form-group">
            <label for="id_password">Password</label>
            <div class="password-wrapper">
                <input 
                    type="password" 
                    name="password" 
                    id="id_password" 
                    class="form-control" 
                    placeholder="Enter your password"
                    required
                >
                <button type="button" class="password-toggle-btn" onclick="togglePassword(this, 'id_password')">
                    <!-- Eye Open SVG -->
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <!-- Eye Closed SVG -->
                    <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Sign In to Vote</button>
    </form>
    
    <p style="text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 14px;">
        New voter? <a href="{% url 'register' %}" style="color: var(--color-primary); text-decoration: none; font-weight: 600;">Register Here</a>
    </p>
</div>

<script>
    function togglePassword(btn, inputId) {
        const input = document.getElementById(inputId);
        const openIcon = btn.querySelector('.eye-open');
        const closedIcon = btn.querySelector('.eye-closed');
        
        if (input.type === 'password') {
            input.type = 'text';
            openIcon.style.display = 'none';
            closedIcon.style.display = 'block';
        } else {
            input.type = 'password';
            openIcon.style.display = 'block';
            closedIcon.style.display = 'none';
        }
    }
</script>
{% endblock %}
